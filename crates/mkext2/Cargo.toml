[package]
name = "mkext2"
description = "Reproducible ext2 filesystem image generator (a Rust port of genext2fs)"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["ext2", "filesystem", "image", "genext2fs", "reproducible"]
categories = ["filesystem", "command-line-utilities"]
exclude = ["/examples"]

[lib]
name = "mkext2"

[[bin]]
name = "mkext2"
path = "src/main.rs"

[features]
default = ["gzip", "bzip2", "xz", "zstd"]
gzip = ["dep:flate2"]
bzip2 = ["dep:bzip2"]
xz = ["dep:liblzma"]
zstd = ["dep:zstd"]

[dependencies]
flate2 = { version = "1.1", optional = true, default-features = false, features = ["zlib-rs"] }
bzip2 = { version = "0.6", optional = true }
liblzma = { version = "0.4", optional = true, features = ["static"] }
zstd = { version = "0.14", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
